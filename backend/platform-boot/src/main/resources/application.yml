# 文件作用：定义后端生产运行时的端口、基础设施连接、迁移、持久化和 IAM 安全配置。
server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: saas-portal
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:saas_portal}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectTimeout=3000&socketTimeout=3000
    username: ${MYSQL_USERNAME:saas_portal}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

saas:
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    login-failure-limit: ${LOGIN_FAILURE_LIMIT:5}
    login-failure-window: ${LOGIN_FAILURE_WINDOW:15m}
    login-lock-duration: ${LOGIN_LOCK_DURATION:15m}
  bootstrap:
    tenant-code: ${BOOTSTRAP_TENANT_CODE:}
    tenant-name: ${BOOTSTRAP_TENANT_NAME:}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never
